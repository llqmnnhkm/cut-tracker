# Sends Cut Tracker's lock screen alerts. Deployed by .github/workflows/deploy.yml
# when the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets are set.
name = "cut-tracker-push"
main = "src/index.ts"
compatibility_date = "2025-09-01"
workers_dev = true

[vars]
ALLOWED_ORIGIN = "https://llqmnnhkm.github.io"
VAPID_SUBJECT = "https://llqmnnhkm.github.io/cut-tracker/"

[[durable_objects.bindings]]
name = "SESSIONS"
class_name = "Sessions"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Sessions"]
